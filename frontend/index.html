<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ClearShot - Swarm Tasking Engine</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.114.0/Cesium.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.114.0/Widgets/widgets.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
  <script src="../config.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      background: #02060f;
    }

    /* Glassmorphism Command Center UI */
    #dashboard {
      position: absolute; top: 20px; left: 20px; width: 420px; max-height: calc(100vh - 160px); overflow-y: auto;
      background: rgba(4, 10, 20, 0.65); 
      border: 1px solid rgba(0, 229, 255, 0.2); 
      border-top: 3px solid #00e5ff;
      border-radius: 8px; color: #cfd8dc; padding: 20px; z-index: 1000;
      box-shadow: 0 12px 32px rgba(0,0,0,0.8), inset 0 0 20px rgba(0, 229, 255, 0.05); 
      backdrop-filter: blur(12px);
      font-family: 'Rajdhani', sans-serif;
    }
    
    #dashboard::-webkit-scrollbar { width: 4px; }
    #dashboard::-webkit-scrollbar-thumb { background: #00e5ff; border-radius: 2px; }

    h2 { 
      margin: 0 0 8px 0; font-size: 22px; font-weight: 700; letter-spacing: 2px; 
      color: #fff; text-transform: uppercase; text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }
    
    .badge { 
      font-size: 12px; background: rgba(0, 229, 255, 0.1); color: #00e5ff; 
      border: 1px solid #00e5ff; padding: 3px 8px; border-radius: 4px; 
      font-weight: 700; float: right; font-family: 'Share Tech Mono', monospace;
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
    }
    
    .subtext { font-size: 14px; color: #829ab1; margin-bottom: 16px; font-weight: 500; }

    .instructions {
      background: rgba(0, 229, 255, 0.05); border-left: 3px solid #00e5ff;
      padding: 10px; border-radius: 0 4px 4px 0; font-size: 13px; color: #84ffff; 
      margin-bottom: 16px;
    }

    /* Radar-Style Table */
    table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-family: 'Share Tech Mono', monospace; font-size: 12px; }
    th { text-align: left; color: #829ab1; padding: 0 8px 8px 8px; font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 600; text-transform: uppercase;}
    
    .pass-row { 
      cursor: pointer; transition: all 0.2s; 
      background: rgba(16, 32, 56, 0.4);
    }
    .pass-row td { padding: 10px 8px; border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); }
    .pass-row td:first-child { border-left: 1px solid rgba(255,255,255,0.05); border-radius: 4px 0 0 4px; }
    .pass-row td:last-child { border-right: 1px solid rgba(255,255,255,0.05); border-radius: 0 4px 4px 0; }
    
    .pass-row:hover { 
      background: rgba(0, 229, 255, 0.15); 
      transform: translateX(4px);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
    }
    .pass-row:hover td { border-color: rgba(0, 229, 255, 0.3); }

    .sat-tag { padding: 3px 6px; border-radius: 3px; font-weight: bold; font-size: 10px; color: #000; text-transform: uppercase; }
    /* Time-to-image panel */
    #acq { background: rgba(0, 255, 102, 0.06); border: 1px solid rgba(0, 255, 102, 0.35); border-radius: 6px; padding: 12px; margin-bottom: 14px; }
    #acq.none { background: rgba(255, 0, 60, 0.06); border-color: rgba(255, 0, 60, 0.35); }
    .acq-label { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #829ab1; text-transform: uppercase; }
    .acq-head { font-size: 20px; font-weight: 700; color: #fff; margin: 2px 0 8px 0; }
    .acq-head .eta { color: #00ff66; text-shadow: 0 0 8px rgba(0, 255, 102, 0.5); }
    #acq.none .acq-head { color: #ff6b8b; }
    .acq-stats { display: flex; gap: 6px; font-family: 'Share Tech Mono', monospace; }
    .acq-stat { flex: 1; background: rgba(16, 32, 56, 0.6); border-radius: 4px; padding: 5px 4px; text-align: center; }
    .acq-stat b { display: block; color: #fff; font-size: 15px; }
    .acq-stat span { font-size: 10px; color: #829ab1; }
    .btn-jump { margin-top: 10px; width: 100%; cursor: pointer; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 1px;
      color: #02060f; background: #00ff66; border: none; border-radius: 4px; padding: 6px; text-transform: uppercase; }
    .btn-jump:hover { box-shadow: 0 0 12px rgba(0, 255, 102, 0.6); }
    .pass-row.rec { background: rgba(0, 255, 102, 0.14); }
    .pass-row.rec td { border-color: rgba(0, 255, 102, 0.6); }
    .pass-row.night { opacity: 0.38; }
    .lead { display: block; font-size: 10px; color: #829ab1; }
    .tag-note { font-size: 10px; color: #829ab1; text-transform: uppercase; }

    .btn-view { color: #00e5ff; font-weight: bold; background: rgba(0, 229, 255, 0.1); padding: 4px 8px; border-radius: 3px; text-transform: uppercase; font-size: 10px;}
  </style>
</head>
<body>

  <div id="dashboard">
    <h2>CLEARSHOT <span class="badge">LIVE</span></h2>
    <div class="subtext">AI-Optimized Image Acquisition</div>

    <div class="instructions">
      <strong>STANDBY:</strong> Select a predicted pass below to initiate intercept vector.
    </div>

    <div style="font-family: 'Share Tech Mono'; font-size: 11px; margin-bottom: 4px; color: #829ab1; text-transform: uppercase;">
      Active Target Coordinates
    </div>
    <div style="font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 16px; text-shadow: 0 0 8px rgba(255,255,255,0.3);">
      <span id="target-coords">Awaiting Telemetry...</span>
    </div>
    
    <div id="acq" style="display:none"></div>

    <table id="passes-table">
      <thead>
        <tr>
          <th>Asset</th>
          <th>Peak (UTC)</th>
          <th>Clouds</th>
          <th>Score</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="passes-body">
        <tr><td colspan="5" style="text-align:center; padding: 20px;">Fetching Contract Data...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="cesiumContainer"></div>

  <script>
    // 1. Core Engine Setup
    Cesium.Ion.defaultAccessToken = typeof CESIUM_TOKEN !== 'undefined' ? CESIUM_TOKEN : '';
    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: true, timeline: true, baseLayerPicker: false, geocoder: false,
      homeButton: false, navigationHelpButton: false, sceneModePicker: false,
      infoBox: false, selectionIndicator: false
    });

    viewer.scene.globe.enableLighting = true;
    viewer.scene.globe.atmosphereLightIntensity = 15.0;
    viewer.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);

    // Timeline. Anchored to the contract's generated_at (not the browser clock),
    // so every pass in the table falls inside the sampled orbit range.
    const SAMPLE_STEP_S = 30;
    let durationSeconds = 72 * 3600;
    let epoch = null;          // JulianDate the orbits were sampled from
    let satsBuiltFor = null;   // TLE signature of the satellites on the globe
    let activeTarget = null;   // read live by the swath highlight callbacks
    let targetEntity = null;
    let requestSeq = 0;        // only the newest click is allowed to render

    function surfaceDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371.0;
      const dLat = Cesium.Math.toRadians(lat2 - lat1);
      const dLon = Cesium.Math.toRadians(lon2 - lon1);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(Cesium.Math.toRadians(lat1)) * Math.cos(Cesium.Math.toRadians(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function fmtPeak(iso) {
      const d = new Date(iso);
      const day = d.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' });
      return `${day} ${iso.substring(11, 16)}`;
    }

    function fmtHours(h) {
      if (h === null || h === undefined) return '--';
      return h < 1 ? `${Math.round(h * 60)} min` : `${h.toFixed(1)} h`;
    }

    function pct(p) { return `${Math.round(p * 100)}%`; }

    function jumpTo(pass) {
      const peak = Cesium.JulianDate.fromIso8601(pass.peak_utc);
      viewer.clock.currentTime = Cesium.JulianDate.addSeconds(peak, -15, new Cesium.JulianDate());
      viewer.clock.multiplier = 1.0;
    }

    // Orbits depend only on the TLEs, never on the target, so they are
    // propagated once instead of on every click (8 sats x 8,640 samples).
    function buildSatellites(contract) {
      const signature = contract.satellites.map(s => s.tle1).join('|');
      const genTime = Cesium.JulianDate.fromIso8601(contract.generated_at);
      const drift = epoch ? Cesium.JulianDate.secondsDifference(genTime, epoch) : Infinity;
      if (signature === satsBuiltFor && drift < 3600) return;

      const t0 = performance.now();
      viewer.entities.removeAll();
      targetEntity = null;
      epoch = genTime;
      durationSeconds = (contract.horizon_hours || 72) * 3600;
      viewer.clock.startTime = epoch.clone();
      viewer.clock.stopTime = Cesium.JulianDate.addSeconds(epoch, durationSeconds, new Cesium.JulianDate());
      viewer.clock.currentTime = Cesium.JulianDate.now();
      viewer.clock.clockRange = Cesium.ClockRange.LOOP_STOP;
      viewer.clock.multiplier = 100;
      viewer.timeline.zoomTo(viewer.clock.startTime, viewer.clock.stopTime);

      contract.satellites.forEach(satConfig => {
        const satrec = satellite.twoline2satrec(satConfig.tle1, satConfig.tle2);
        const satPosProp = new Cesium.SampledPositionProperty();
        const swathRadiusKm = satConfig.swathKm / 2.0;
        const color = Cesium.Color.fromCssColorString(satConfig.colorHex);

        for (let t = 0; t <= durationSeconds; t += SAMPLE_STEP_S) {
          const time = Cesium.JulianDate.addSeconds(epoch, t, new Cesium.JulianDate());
          const jsDate = Cesium.JulianDate.toDate(time);
          const pv = satellite.propagate(satrec, jsDate);
          if (pv.position) {
            const geodetic = satellite.eciToGeodetic(pv.position, satellite.gstime(jsDate));
            satPosProp.addSample(time, Cesium.Cartesian3.fromDegrees(
              Cesium.Math.toDegrees(geodetic.longitude), Cesium.Math.toDegrees(geodetic.latitude), geodetic.height * 1000));
          }
        }

        // force Cesium to curve the path using Lagrange polynomials instead of straight lines
        satPosProp.setInterpolationOptions({
          interpolationDegree: 5,
          interpolationAlgorithm: Cesium.LagrangePolynomialApproximation
        });

        viewer.entities.add({
          position: satPosProp,
          orientation: new Cesium.VelocityOrientationProperty(satPosProp),
          model: { uri: '../satellite.glb', minimumPixelSize: 64, maximumScale: 20000 },
          point: { pixelSize: 4, color: color },
          path: { resolution: 120, material: new Cesium.PolylineGlowMaterialProperty({ glowPower: 0.1, color: color.withAlpha(0.8) }), width: 2 }
        });

        viewer.entities.add({
          // Project the footprint exactly onto the surface to prevent underground sinking
          position: new Cesium.CallbackProperty((time) => {
            const sPos = satPosProp.getValue(time);
            if (!sPos) return undefined;
            const carto = Cesium.Cartographic.fromCartesian(sPos);
            return Cesium.Cartesian3.fromRadians(carto.longitude, carto.latitude, 0);
          }, false),
          ellipse: {
            semiMinorAxis: satConfig.swathKm * 500, semiMajorAxis: satConfig.swathKm * 500,
            material: new Cesium.ColorMaterialProperty(new Cesium.CallbackProperty((time) => {
              const sPos = satPosProp.getValue(time);
              if (sPos && activeTarget) {
                const c = Cesium.Cartographic.fromCartesian(sPos);
                const d = surfaceDistanceKm(Cesium.Math.toDegrees(c.latitude), Cesium.Math.toDegrees(c.longitude), activeTarget.lat, activeTarget.lon);
                if (d <= swathRadiusKm) return Cesium.Color.GOLD.withAlpha(0.6);
              }
              return color.withAlpha(0.15);
            }, false)),
            outline: true, outlineColor: color
          }
        });

        viewer.entities.add({
          polyline: {
            // Dotted nadir line follows the clamped surface point
            positions: new Cesium.CallbackProperty((time) => {
              const sPos = satPosProp.getValue(time);
              if (!sPos) return [];
              const carto = Cesium.Cartographic.fromCartesian(sPos);
              return [sPos, Cesium.Cartesian3.fromRadians(carto.longitude, carto.latitude, 0)];
            }, false),
            width: 2,
            material: new Cesium.PolylineDashMaterialProperty({ color: color.withAlpha(0.7), dashLength: 15.0 })
          }
        });
      });

      satsBuiltFor = signature;
      console.log(`Orbits propagated in ${(performance.now() - t0).toFixed(0)} ms`);
    }

    // The headline answer: how soon is a usable image likely?
    function renderAcquisition(target) {
      const panel = document.getElementById('acq');
      const acq = target.acquisition;
      if (!acq) { panel.style.display = 'none'; return; }
      panel.style.display = 'block';
      const rec = (target.passes || []).find(p => p.pass_id === acq.recommended_pass_id);
      const horizon = Math.round(durationSeconds / 3600);
      const stats = `
        <div class="acq-stats">
          <div class="acq-stat"><b>${pct(acq.p_image_24h)}</b><span>&le; 24 h</span></div>
          <div class="acq-stat"><b>${pct(acq.p_image_48h)}</b><span>&le; 48 h</span></div>
          <div class="acq-stat"><b>${pct(acq.p_image_horizon)}</b><span>&le; ${horizon} h</span></div>
          <div class="acq-stat"><b>${fmtHours(acq.median_hours_to_image)}</b><span>median wait</span></div>
        </div>`;

      if (!rec) {
        panel.className = 'none';
        panel.innerHTML = `<div class="acq-label">Time to usable image</div>
          <div class="acq-head">No usable pass in ${horizon} h</div>${stats}`;
        return;
      }
      panel.className = acq.recommended_reason === 'earliest good pass' ? '' : 'none';
      const label = acq.recommended_reason === 'earliest good pass'
        ? 'First likely clear image' : 'Best available (no good pass)';
      panel.innerHTML = `<div class="acq-label">${label} &middot; P(image) by</div>
        <div class="acq-head"></div>${stats}
        <button class="btn-jump">Jump to pass</button>`;
      // textContent: satellite names come from the catalog, keep them inert
      panel.querySelector('.acq-head').innerHTML =
        `<span class="sat"></span> &middot; ${fmtPeak(rec.peak_utc)} UTC &middot; <span class="eta">in ${fmtHours(acq.hours_to_recommended)}</span> &middot; ${pct(rec.scores.model)}`;
      panel.querySelector('.acq-head .sat').textContent = rec.satellite;
      panel.querySelector('.btn-jump').onclick = () => jumpTo(rec);
    }

    // The Reusable Rendering Engine
    function renderContractData(contract) {
        const tbody = document.getElementById('passes-body');
        tbody.innerHTML = "";

        if (!contract.targets || contract.targets.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px;">No targets in contract</td></tr>`;
            return;
        }

        buildSatellites(contract);

        const target = contract.targets[0];
        activeTarget = target;
        const displayName = target.name || "Custom Target";
        document.getElementById('target-coords').innerText = `${displayName} | ${target.lat.toFixed(3)}°, ${target.lon.toFixed(3)}°`;

        // Swap only the target marker; the orbits stay put
        if (targetEntity) viewer.entities.remove(targetEntity);
        targetEntity = viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(target.lon, target.lat, 0),
          point: { pixelSize: 8, color: Cesium.Color.WHITE, outlineColor: Cesium.Color.AQUA, outlineWidth: 3 },
          label: {
            text: displayName, font: "bold 14px 'Rajdhani'", fillColor: Cesium.Color.WHITE,
            showBackground: true, backgroundColor: new Cesium.Color(0, 0.9, 1.0, 0.3),
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM, pixelOffset: new Cesium.Cartesian2(0, -15)
          }
        });

        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(target.lon, target.lat, 3500000.0),
          duration: 1.5
        });

        renderAcquisition(target);
        const recId = target.acquisition ? target.acquisition.recommended_pass_id : null;

        if (!target.passes || target.passes.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color:#ff003c;">No actionable passes found in ${Math.round(durationSeconds / 3600)}h window.</td></tr>`;
            return;
        }

        target.passes.forEach(pass => {
          let verdictColor = '#f4c430';
          let glowColor = 'rgba(244, 196, 48, 0.5)';
          if (pass.verdict === 'good') {
              verdictColor = '#00ff66';
              glowColor = 'rgba(0, 255, 102, 0.5)';
          } else if (pass.verdict === 'bad') {
              verdictColor = '#ff003c';
              glowColor = 'rgba(255, 0, 60, 0.5)';
          }

          const isNight = pass.limited_by === 'night';
          const scoreCell = isNight
            ? `<span class="tag-note">night</span>`
            : `${(pass.scores.model * 100).toFixed(0)}`;
          const row = document.createElement('tr');
          row.className = 'pass-row' + (pass.pass_id === recId ? ' rec' : '') + (isNight ? ' night' : '');
          row.innerHTML = `
            <td><span class="sat-tag" style="background:#fff"></span>${pass.imaging === false ? '<span class="lead">visual</span>' : ''}</td>
            <td style="color:#fff; font-size: 14px;">${fmtPeak(pass.peak_utc)}<span class="lead">T+${pass.lead_time_hours.toFixed(1)}h</span></td>
            <td style="color:${verdictColor}; text-shadow: 0 0 8px ${glowColor};">${pass.cloud_forecast_pct}%</td>
            <td style="color:#fff;">${scoreCell}</td>
            <td><span class="btn-view">${pass.pass_id === recId ? 'Best' : 'Intercept'}</span></td>
          `;
          row.querySelector('.sat-tag').textContent = pass.satellite.substring(0, 8);
          row.onclick = () => jumpTo(pass);
          tbody.appendChild(row);
        });
    }

    // Initial Boot (loads the Blacksburg passes instantly)
    async function bootSystem() {
        const seq = ++requestSeq;
        try {
            const response = await fetch('http://localhost:8000/api/passes');
            const contract = await response.json();
            if (seq === requestSeq) renderContractData(contract);
        } catch (error) {
            console.error("Boot failed:", error);
        }
    }

    // Interactive Map Clicking (hits the live API)
    viewer.screenSpaceEventHandler.setInputAction(async function(click) {
      const ray = viewer.camera.getPickRay(click.position);
      const intersection = viewer.scene.globe.pick(ray, viewer.scene);
      if (!intersection) return;

      const cartographic = Cesium.Cartographic.fromCartesian(intersection);
      const lat = Cesium.Math.toDegrees(cartographic.latitude);
      const lon = Cesium.Math.toDegrees(cartographic.longitude);
      const seq = ++requestSeq;

      // UI Loading State (orbits stay on the globe)
      document.getElementById('target-coords').innerText = `CALCULATING OVERRIDE...`;
      document.getElementById('acq').style.display = 'none';
      document.getElementById('passes-body').innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color:#00e5ff;">Predicting Clear-Sky Windows...</td></tr>`;

      try {
          const response = await fetch(`http://localhost:8000/api/calculate?lat=${lat}&lon=${lon}`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const contract = await response.json();
          if (seq !== requestSeq) return;  // a newer click superseded this one
          renderContractData(contract);
      } catch (error) {
          if (seq !== requestSeq) return;
          console.error("Live calculation failed:", error);
          document.getElementById('passes-body').innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color:#ff003c;">Tasking Failed. API Unreachable.</td></tr>`;
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    bootSystem();
  </script>
</body>
</html>
