<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ClearShot - Swarm Tasking Engine</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.114.0/Cesium.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.114.0/Widgets/widgets.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
  <script src="../config.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      background: #02060f;
    }

    /* Glassmorphism Command Center UI */
    #dashboard {
      position: absolute; top: 20px; left: 20px; width: 420px; max-height: calc(100vh - 160px); overflow-y: auto;
      background: rgba(4, 10, 20, 0.65); 
      border: 1px solid rgba(0, 229, 255, 0.2); 
      border-top: 3px solid #00e5ff;
      border-radius: 8px; color: #cfd8dc; padding: 20px; z-index: 1000;
      box-shadow: 0 12px 32px rgba(0,0,0,0.8), inset 0 0 20px rgba(0, 229, 255, 0.05); 
      backdrop-filter: blur(12px);
      font-family: 'Rajdhani', sans-serif;
    }
    
    #dashboard::-webkit-scrollbar { width: 4px; }
    #dashboard::-webkit-scrollbar-thumb { background: #00e5ff; border-radius: 2px; }

    h2 { 
      margin: 0 0 8px 0; font-size: 22px; font-weight: 700; letter-spacing: 2px; 
      color: #fff; text-transform: uppercase; text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }
    
    .badge { 
      font-size: 12px; background: rgba(0, 229, 255, 0.1); color: #00e5ff; 
      border: 1px solid #00e5ff; padding: 3px 8px; border-radius: 4px; 
      font-weight: 700; float: right; font-family: 'Share Tech Mono', monospace;
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
    }
    
    .subtext { font-size: 14px; color: #829ab1; margin-bottom: 16px; font-weight: 500; }

    .instructions {
      background: rgba(0, 229, 255, 0.05); border-left: 3px solid #00e5ff;
      padding: 10px; border-radius: 0 4px 4px 0; font-size: 13px; color: #84ffff; 
      margin-bottom: 16px;
    }

    /* Radar-Style Table */
    table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-family: 'Share Tech Mono', monospace; font-size: 12px; }
    th { text-align: left; color: #829ab1; padding: 0 8px 8px 8px; font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 600; text-transform: uppercase;}
    
    .pass-row { 
      cursor: pointer; transition: all 0.2s; 
      background: rgba(16, 32, 56, 0.4);
    }
    .pass-row td { padding: 10px 8px; border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); }
    .pass-row td:first-child { border-left: 1px solid rgba(255,255,255,0.05); border-radius: 4px 0 0 4px; }
    .pass-row td:last-child { border-right: 1px solid rgba(255,255,255,0.05); border-radius: 0 4px 4px 0; }
    
    .pass-row:hover { 
      background: rgba(0, 229, 255, 0.15); 
      transform: translateX(4px);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
    }
    .pass-row:hover td { border-color: rgba(0, 229, 255, 0.3); }

    .sat-tag { padding: 3px 6px; border-radius: 3px; font-weight: bold; font-size: 10px; color: #000; text-transform: uppercase; }
    .btn-view { color: #00e5ff; font-weight: bold; background: rgba(0, 229, 255, 0.1); padding: 4px 8px; border-radius: 3px; text-transform: uppercase; font-size: 10px;}
  </style>
</head>
<body>

  <div id="dashboard">
    <h2>CLEARSHOT <span class="badge">LIVE</span></h2>
    <div class="subtext">AI-Optimized Image Acquisition</div>

    <div class="instructions">
      <strong>STANDBY:</strong> Select a predicted pass below to initiate intercept vector.
    </div>

    <div style="font-family: 'Share Tech Mono'; font-size: 11px; margin-bottom: 4px; color: #829ab1; text-transform: uppercase;">
      Active Target Coordinates
    </div>
    <div style="font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 16px; text-shadow: 0 0 8px rgba(255,255,255,0.3);">
      <span id="target-coords">Awaiting Telemetry...</span>
    </div>
    
    <table id="passes-table">
      <thead>
        <tr>
          <th>Asset</th>
          <th>TCA (UTC)</th>
          <th>Clouds</th>
          <th>Score</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="passes-body">
        <tr><td colspan="5" style="text-align:center; padding: 20px;">Fetching Contract Data...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="cesiumContainer"></div>

  <script>
    // 1. Core Engine Setup
    Cesium.Ion.defaultAccessToken = typeof CESIUM_TOKEN !== 'undefined' ? CESIUM_TOKEN : '';
    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: true, timeline: true, baseLayerPicker: false, geocoder: false,
      homeButton: false, navigationHelpButton: false, sceneModePicker: false,
      infoBox: false, selectionIndicator: false
    });

    viewer.scene.globe.enableLighting = true;
    viewer.scene.globe.atmosphereLightIntensity = 15.0;
    viewer.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);

    // Timeline Configuration (72h window)
    const now = Cesium.JulianDate.fromDate(new Date());
    const durationSeconds = 72 * 3600; 
    const stopTime = Cesium.JulianDate.addSeconds(now, durationSeconds, new Cesium.JulianDate());
    viewer.clock.startTime = now;
    viewer.clock.stopTime = stopTime;
    viewer.clock.currentTime = now;
    viewer.clock.clockRange = Cesium.ClockRange.LOOP_STOP;
    viewer.clock.multiplier = 100;

    function surfaceDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371.0;
      const dLat = Cesium.Math.toRadians(lat2 - lat1);
      const dLon = Cesium.Math.toRadians(lon2 - lon1);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(Cesium.Math.toRadians(lat1)) * Math.cos(Cesium.Math.toRadians(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // 2. The Reusable Rendering Engine
    function renderContractData(contract) {
        const tbody = document.getElementById('passes-body');
        tbody.innerHTML = "";
        viewer.entities.removeAll(); // Clear the globe

        if (!contract.targets || contract.targets.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px;">No targets in contract</td></tr>`;
            return;
        }

        const target = contract.targets[0];
        const displayName = target.name || "Custom Target";
        document.getElementById('target-coords').innerText = `${displayName} | ${target.lat.toFixed(3)}°, ${target.lon.toFixed(3)}°`;
        
        // Render Glowing Target
        viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(target.lon, target.lat, 0),
          point: { pixelSize: 8, color: Cesium.Color.WHITE, outlineColor: Cesium.Color.AQUA, outlineWidth: 3 },
          label: { 
            text: displayName, font: "bold 14px 'Rajdhani'", fillColor: Cesium.Color.WHITE, 
            showBackground: true, backgroundColor: new Cesium.Color(0, 0.9, 1.0, 0.3), 
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM, pixelOffset: new Cesium.Cartesian2(0, -15) 
          }
        });

        // Fly Camera to New Target
        viewer.camera.flyTo({ 
          destination: Cesium.Cartesian3.fromDegrees(target.lon, target.lat, 3500000.0), 
          duration: 1.5 
        });

        if (!target.passes || target.passes.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color:#ff003c;">No actionable passes found in 72h window.</td></tr>`;
        } else {
            // Populate Dashboard Table
            target.passes.forEach(pass => {
              const peakTime = Cesium.JulianDate.fromIso8601(pass.peak_utc);
              const timeStr = pass.peak_utc.substring(11, 16); 
              
              let verdictColor = '#f4c430'; 
              let glowColor = 'rgba(244, 196, 48, 0.5)';
              if (pass.verdict === 'good') {
                  verdictColor = '#00ff66'; 
                  glowColor = 'rgba(0, 255, 102, 0.5)';
              } else if (pass.verdict === 'bad') {
                  verdictColor = '#ff003c'; 
                  glowColor = 'rgba(255, 0, 60, 0.5)';
              }
              
              const scoreStr = (pass.scores.model * 100).toFixed(0);
              const row = document.createElement('tr');
              row.className = 'pass-row';
              row.innerHTML = `
                <td><span class="sat-tag" style="background:#fff">${pass.satellite.substring(0,8)}</span></td>
                <td style="color:#fff; font-size: 14px;">${timeStr}</td>
                <td style="color:${verdictColor}; text-shadow: 0 0 8px ${glowColor};">${pass.cloud_forecast_pct}%</td>
                <td style="color:#fff;">${scoreStr}</td>
                <td><span class="btn-view">Intercept</span></td>
              `;
              
              row.onclick = () => { 
                viewer.clock.currentTime = Cesium.JulianDate.addSeconds(peakTime, -15, new Cesium.JulianDate()); 
                viewer.clock.multiplier = 1.0; 
              };
              tbody.appendChild(row);
            });
        }

        // Render Satellites & Swaths
        contract.satellites.forEach(satConfig => {
          const satrec = satellite.twoline2satrec(satConfig.tle1, satConfig.tle2);
          const satPosProp = new Cesium.SampledPositionProperty();
          const swathRadiusKm = satConfig.swathKm / 2.0;
          
          for (let t = 0; t <= durationSeconds; t += 30) {
            const time = Cesium.JulianDate.addSeconds(now, t, new Cesium.JulianDate());
            const jsDate = Cesium.JulianDate.toDate(time);
            const pv = satellite.propagate(satrec, jsDate);

            if (pv.position) {
              const gmst = satellite.gstime(jsDate);
              const geodetic = satellite.eciToGeodetic(pv.position, gmst);
              const lat = Cesium.Math.toDegrees(geodetic.latitude);
              const lon = Cesium.Math.toDegrees(geodetic.longitude);
              const alt = geodetic.height * 1000;

              satPosProp.addSample(time, Cesium.Cartesian3.fromDegrees(lon, lat, alt));
            }
          }

          // force Cesium to curve the path using Lagrange polynomials instead of straight lines
          satPosProp.setInterpolationOptions({
              interpolationDegree: 5,
              interpolationAlgorithm: Cesium.LagrangePolynomialApproximation
          });

          viewer.entities.add({
            position: satPosProp,
            orientation: new Cesium.VelocityOrientationProperty(satPosProp),
            model: { uri: '../satellite.glb', minimumPixelSize: 64, maximumScale: 20000 },
            point: { pixelSize: 4, color: Cesium.Color.fromCssColorString(satConfig.colorHex) },
            path: { resolution: 120, material: new Cesium.PolylineGlowMaterialProperty({ glowPower: 0.1, color: Cesium.Color.fromCssColorString(satConfig.colorHex).withAlpha(0.8) }), width: 2 }
          });

          viewer.entities.add({
            // FIX 2: Dynamically project the footprint exactly onto the surface to prevent underground sinking
            position: new Cesium.CallbackProperty((time) => {
                const sPos = satPosProp.getValue(time);
                if (sPos) {
                    const carto = Cesium.Cartographic.fromCartesian(sPos);
                    return Cesium.Cartesian3.fromRadians(carto.longitude, carto.latitude, 0);
                }
                return undefined;
            }, false),
            ellipse: {
              semiMinorAxis: satConfig.swathKm * 500, semiMajorAxis: satConfig.swathKm * 500,
              material: new Cesium.ColorMaterialProperty(new Cesium.CallbackProperty((time) => {
                  const sPos = satPosProp.getValue(time);
                  if(sPos) {
                      const c = Cesium.Cartographic.fromCartesian(sPos);
                      const d = surfaceDistanceKm(Cesium.Math.toDegrees(c.latitude), Cesium.Math.toDegrees(c.longitude), target.lat, target.lon);
                      if(d <= swathRadiusKm) return Cesium.Color.GOLD.withAlpha(0.6); 
                  }
                  return Cesium.Color.fromCssColorString(satConfig.colorHex).withAlpha(0.15);
              }, false)),
              outline: true, outlineColor: Cesium.Color.fromCssColorString(satConfig.colorHex)
            }
          });

          viewer.entities.add({
            polyline: {
              // FIX 3: Re-map the dotted nadir line to follow the clamped surface point
              positions: new Cesium.CallbackProperty((time) => {
                const sPos = satPosProp.getValue(time);
                if (!sPos) return [];
                const carto = Cesium.Cartographic.fromCartesian(sPos);
                const gPos = Cesium.Cartesian3.fromRadians(carto.longitude, carto.latitude, 0);
                return [sPos, gPos]; 
              }, false),
              width: 2,
              material: new Cesium.PolylineDashMaterialProperty({ color: Cesium.Color.fromCssColorString(satConfig.colorHex).withAlpha(0.7), dashLength: 15.0 })
            }
          });
        });
    }

    // 3. Initial Boot (Loads static Blacksburg passes instantly)
    async function bootSystem() {
        try {
            const response = await fetch('http://localhost:8000/api/passes');
            const contract = await response.json();
            renderContractData(contract);
        } catch (error) {
            console.error("Boot failed:", error);
        }
    }

    // 4. Interactive Map Clicking (Hits new live API)
    viewer.screenSpaceEventHandler.setInputAction(async function(click) {
      const ray = viewer.camera.getPickRay(click.position);
      const intersection = viewer.scene.globe.pick(ray, viewer.scene);
      
      if (intersection) {
        const cartographic = Cesium.Cartographic.fromCartesian(intersection);
        const lat = Cesium.Math.toDegrees(cartographic.latitude);
        const lon = Cesium.Math.toDegrees(cartographic.longitude);
        
        // UI Loading State
        document.getElementById('target-coords').innerText = `CALCULATING OVERRIDE...`;
        document.getElementById('passes-body').innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color:#00e5ff;">Predicting Clear-Sky Windows...</td></tr>`;
        viewer.entities.removeAll();
        
        try {
            const response = await fetch(`http://localhost:8000/api/calculate?lat=${lat}&lon=${lon}`);
            const contract = await response.json();
            renderContractData(contract);
        } catch (error) {
            console.error("Live calculation failed:", error);
            document.getElementById('passes-body').innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color:#ff003c;">Tasking Failed. API Unreachable.</td></tr>`;
        }
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    bootSystem();
  </script>
</body>
</html>
